services:
  myroomie:
    build: .
    image: myroomie:local
    container_name: myroomie-web
    ports:
      - "8060:8060"
    volumes:
      - myroomie-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8060/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  myroomie-data:
