<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myRoomie</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <span id="brand">myRoomie</span>
  <span id="topbar-info" class="grow"></span>
  <span id="lang-switch"></span>
  <button id="top-logout" class="ghost hidden"></button>
</header>

<main id="stage">

  <section id="auth" class="screen card">
    <h1 id="auth-title">myRoomie</h1>
    <p id="auth-subtitle" class="muted"></p>
    <input id="username" autocomplete="username">
    <input id="password" type="password" autocomplete="current-password">
    <div class="row">
      <button id="login-btn" class="primary"></button>
      <button id="register-btn"></button>
    </div>
    <p id="auth-status" class="status"></p>
  </section>

  <section id="creation" class="screen card hidden">
    <h1 id="create-title">myRoomie</h1>
    <p id="create-subtitle" class="muted"></p>
    <input id="roomie-name">
    <select id="gender">
      <option value="girl"></option>
      <option value="boy"></option>
    </select>
    <button id="reroll-btn"></button>
    <p id="preview" class="muted"></p>
    <button id="movein-btn" class="primary"></button>
    <p id="create-status" class="status"></p>
  </section>

  <section id="room" class="screen hidden">
    <div id="scene">
      <img id="scene-bg" alt="">
      <div id="avatar" class="hidden"><img id="avatar-portrait" alt=""><img id="avatar-outfit" class="overlay" alt=""></div>
      <div id="hotspots"></div>
    </div>
    <div id="hud"></div>
  </section>

</main>

<div id="panel-overlay" class="hidden">
  <div id="panel" class="card">
    <div class="row"><h3 id="panel-title" class="grow"></h3><button id="panel-close"></button></div>
    <div id="panel-body"></div>
  </div>
</div>

<div id="minigame" class="hidden">
  <div id="mg-card" class="card">
    <div class="row"><h3 id="mg-title" class="grow"></h3><button id="mg-cancel"></button></div>
    <p id="mg-status" class="muted"></p>
    <div id="mg-area"></div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="i18n.js"></script>
<script src="scenes.js"></script>
<script src="app.js"></script>
</body>
</html>
